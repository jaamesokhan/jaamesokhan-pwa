server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;

    # Optional: serve the API from the same origin (then no CORS is needed and the PWA can be
    # built with VITE_API_BASE_URL=""). Set API_UPSTREAM when starting the container.
    # location /api/ { proxy_pass ${API_UPSTREAM}; proxy_set_header Host $proxy_host; }

    # Service worker and entry points must never be cached, or updates won't roll out.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

    # Hashed build output is immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
